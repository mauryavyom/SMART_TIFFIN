spring.application.name=NutriDeliver

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nutrideliver_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=vyom123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8080

# Error Handling
server.error.include-message=always
server.error.whitelabel.enabled=false

# Thymeleaf
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html